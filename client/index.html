<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Weather Client</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            padding: 40px;
            text-align: center;
        }

        .search-box {
            display: flex;
            max-width: 500px;
            margin: 0 auto 20px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            flex: 1;
            padding: 20px 25px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            background: #f8f9fa;
        }

        .search-button {
            padding: 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .search-button:hover {
            transform: translateY(-2px);
        }

        .units-toggle {
            margin-bottom: 30px;
        }

        .units-toggle label {
            margin: 0 10px;
            cursor: pointer;
        }

        .units-toggle input[type="radio"] {
            margin-right: 5px;
        }

        .weather-display {
            padding: 0 40px 40px;
            min-height: 300px;
        }

        .weather-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            display: none;
        }

        .weather-card.show {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .location-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .location-name {
            font-size: 2rem;
            color: #333;
            margin-bottom: 5px;
        }

        .location-country {
            color: #666;
            font-size: 1.1rem;
        }

        .current-weather {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .weather-item i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .weather-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .weather-label {
            color: #666;
            font-size: 0.9rem;
        }

        .ai-description {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading i {
            font-size: 3rem;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .forecast {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .forecast h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .forecast-time {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .forecast-temp {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 5px;
        }

        .forecast-desc {
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .search-section {
                padding: 20px;
            }
            
            .weather-display {
                padding: 0 20px 20px;
            }
            
            .search-box {
                flex-direction: column;
                border-radius: 15px;
            }
            
            .search-input,
            .search-button {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-sun"></i> MCP Weather</h1>
            <p>Get real-time weather information powered by AI</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="cityInput" placeholder="Enter city name (e.g., London, New York, Tokyo)" />
                <button class="search-button" onclick="getWeather()">
                    <i class="fas fa-search"></i> Get Weather
                </button>
            </div>

            <div class="units-toggle">
                <label>
                    <input type="radio" name="units" value="metric" checked> Celsius (°C)
                </label>
                <label>
                    <input type="radio" name="units" value="imperial"> Fahrenheit (°F)
                </label>
                <label>
                    <input type="radio" name="units" value="kelvin"> Kelvin (K)
                </label>
            </div>
        </div>

        <div class="weather-display">
            <div id="loading" class="loading" style="display: none;">
                <i class="fas fa-spinner"></i>
                <p>Fetching weather data...</p>
            </div>

            <div id="error" class="error" style="display: none;"></div>

            <div id="weatherCard" class="weather-card">
                <div class="location-info">
                    <div class="location-name" id="locationName"></div>
                    <div class="location-country" id="locationCountry"></div>
                </div>

                <div class="current-weather">
                    <div class="weather-item">
                        <i class="fas fa-thermometer-half"></i>
                        <div class="weather-value" id="temperature"></div>
                        <div class="weather-label">Temperature</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-thermometer-empty"></i>
                        <div class="weather-value" id="feelsLike"></div>
                        <div class="weather-label">Feels Like</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-tint"></i>
                        <div class="weather-value" id="humidity"></div>
                        <div class="weather-label">Humidity</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-wind"></i>
                        <div class="weather-value" id="windSpeed"></div>
                        <div class="weather-label">Wind Speed</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-eye"></i>
                        <div class="weather-value" id="visibility"></div>
                        <div class="weather-label">Visibility</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-sun"></i>
                        <div class="weather-value" id="description"></div>
                        <div class="weather-label">Conditions</div>
                    </div>
                </div>

                <div class="ai-description" id="aiDescription"></div>

                <div class="forecast">
                    <h3>5-Hour Forecast</h3>
                    <div class="forecast-items" id="forecastItems"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="weather-client.js"></script>
</body>
</html>
