<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Weather Client</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-card: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --border-color: #333333;
            --shadow-light: 0 4px 6px rgba(0, 0, 0, 0.3);
            --shadow-heavy: 0 20px 40px rgba(0, 0, 0, 0.5);
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 24px;
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: var(--accent-gradient);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .search-section {
            padding: 40px;
            text-align: center;
            background: var(--bg-secondary);
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto 30px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-light);
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }

        .search-input {
            flex: 1;
            padding: 20px 25px;
            border: none;
            outline: none;
            font-size: 1.1rem;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            background: var(--bg-card);
            box-shadow: inset 0 0 0 2px var(--accent-primary);
            transform: scale(1.02);
        }

        .search-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .search-button {
            padding: 20px 30px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .search-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .search-button:hover::before {
            left: 100%;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .units-toggle {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .units-toggle label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 12px 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .units-toggle label:hover {
            background: var(--bg-card);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .units-toggle input[type="radio"] {
            margin-right: 8px;
            accent-color: var(--accent-primary);
        }

        .units-toggle input[type="radio"]:checked + span {
            color: var(--accent-primary);
        }

        .weather-display {
            padding: 0 40px 40px;
            min-height: 300px;
        }

        .weather-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-light);
            margin-top: 20px;
            display: none;
            border: 1px solid var(--border-color);
        }

        .weather-card.show {
            display: block;
            animation: slideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .location-info {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .location-name {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .location-country {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .current-weather {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .weather-item {
            text-align: center;
            padding: 25px;
            background: var(--bg-tertiary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .weather-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-light);
            border-color: var(--accent-primary);
            background: var(--bg-card);
        }

        .weather-item:active {
            transform: translateY(-2px);
        }

        .weather-item i {
            font-size: 2.5rem;
            color: var(--accent-primary);
            margin-bottom: 15px;
            display: block;
        }

        .weather-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .weather-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-description {
            background: var(--accent-gradient);
            color: white;
            padding: 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .ai-description::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain2" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain2)"/></svg>');
            opacity: 0.2;
        }

        .ai-description > * {
            position: relative;
            z-index: 1;
        }

        .loading {
            text-align: center;
            padding: 60px 40px;
            color: var(--text-secondary);
        }

        .loading i {
            font-size: 4rem;
            color: var(--accent-primary);
            animation: spin 1.5s linear infinite;
            margin-bottom: 20px;
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .loading p {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin: 20px 0;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-weight: 500;
        }

        .forecast {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
        }

        .forecast h3 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }

        .forecast-item {
            background: var(--bg-tertiary);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-light);
        }

        .forecast-time {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .forecast-temp {
            font-size: 1.4rem;
            color: var(--accent-primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .forecast-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 20px;
            }
            
            .header {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .search-section {
                padding: 30px 20px;
            }
            
            .weather-display {
                padding: 0 20px 20px;
            }
            
            .search-box {
                flex-direction: column;
                border-radius: 16px;
            }
            
            .search-input,
            .search-button {
                border-radius: 0;
            }
            
            .weather-card {
                padding: 25px;
            }
            
            .current-weather {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .forecast-items {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .location-name {
                font-size: 2rem;
            }
            
            .current-weather {
                grid-template-columns: 1fr;
            }
            
            .forecast-items {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-sun"></i> MCP Weather</h1>
            <p>Get real-time weather information powered by AI</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="cityInput" placeholder="Enter city name (e.g., London, New York, Tokyo)" />
                <button class="search-button" onclick="getWeather()">
                    <i class="fas fa-search"></i> Get Weather
                </button>
            </div>

            <div class="units-toggle">
                <label>
                    <input type="radio" name="units" value="metric" checked>
                    <span>Celsius (°C)</span>
                </label>
                <label>
                    <input type="radio" name="units" value="imperial">
                    <span>Fahrenheit (°F)</span>
                </label>
                <label>
                    <input type="radio" name="units" value="kelvin">
                    <span>Kelvin (K)</span>
                </label>
            </div>
        </div>

        <div class="weather-display">
            <div id="loading" class="loading" style="display: none;">
                <i class="fas fa-spinner"></i>
                <p>Fetching weather data...</p>
            </div>

            <div id="error" class="error" style="display: none;"></div>

            <div id="weatherCard" class="weather-card">
                <div class="location-info">
                    <div class="location-name" id="locationName"></div>
                    <div class="location-country" id="locationCountry"></div>
                </div>

                <div class="current-weather">
                    <div class="weather-item">
                        <i class="fas fa-thermometer-half"></i>
                        <div class="weather-value" id="temperature"></div>
                        <div class="weather-label">Temperature</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-thermometer-empty"></i>
                        <div class="weather-value" id="feelsLike"></div>
                        <div class="weather-label">Feels Like</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-tint"></i>
                        <div class="weather-value" id="humidity"></div>
                        <div class="weather-label">Humidity</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-wind"></i>
                        <div class="weather-value" id="windSpeed"></div>
                        <div class="weather-label">Wind Speed</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-eye"></i>
                        <div class="weather-value" id="visibility"></div>
                        <div class="weather-label">Visibility</div>
                    </div>
                    <div class="weather-item">
                        <i class="fas fa-sun"></i>
                        <div class="weather-value" id="description"></div>
                        <div class="weather-label">Conditions</div>
                    </div>
                </div>

                <div class="ai-description" id="aiDescription"></div>

                <div class="forecast">
                    <h3>5-Hour Forecast</h3>
                    <div class="forecast-items" id="forecastItems"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="weather-client.js"></script>
</body>
</html>
